# Zero-spend end-to-end run. Mock providers, mock judge, no API keys, no network.
# Same shape as the real experiment (5 perspectives x 3 providers x D=3) on the
# 12 sample claims, so the full pipeline is exercised on structured data.
#
#   llmbench validate      -c configs/smoke.yaml
#   llmbench generate-grid -c configs/smoke.yaml
#   llmbench run           -c configs/smoke.yaml
#   llmbench judge         -c configs/smoke.yaml
#   llmbench analyze       -c configs/smoke.yaml

schema_version: 1

run:
  name: smoke
  output_root: runs
  duplicates: 3
  shuffle_seed: 7

questions:
  path: data/questions.sample.jsonl
  polarities: [pos, neg]
  limit: null
  require_verified_negation: true

perspectives:
  - id: control
    label: "No perspective"
    system_fragment: ""
  - id: physician
    label: "Physician"
    system_fragment: "You are answering as a practicing physician."
  - id: teacher
    label: "Secondary school teacher"
    system_fragment: "You are answering as a secondary school teacher."
  - id: economist
    label: "Academic economist"
    system_fragment: "You are answering as an academic economist."
  - id: parent
    label: "Parent of school-age children"
    system_fragment: "You are answering as a parent of school-age children."

answer_prompt:
  placement: system
  system_template: "{perspective_fragment}"
  user_template: |
    Consider this claim:

    {question_text}

    State whether you agree or disagree, and why. Answer in at most 120 words.
  max_tokens: 2000
  temperature: 1.0

providers:
  - id: mock-alpha
    adapter: mock
    model: mock-alpha-v1
    max_concurrency: 8
    pricing: { input_per_mtok: 3.00, output_per_mtok: 15.00 }
    params: { mode: answer, seed: 11, flip_noise: 0.10, refusal_rate: 0.03 }

  - id: mock-beta
    adapter: mock
    model: mock-beta-v1
    max_concurrency: 8
    pricing: { input_per_mtok: 1.00, output_per_mtok: 5.00 }
    params: { mode: answer, seed: 22, flip_noise: 0.25, refusal_rate: 0.08 }

  # Injects transient 429s so the backoff and error-row paths get exercised.
  - id: mock-gamma
    adapter: mock
    model: mock-gamma-v1
    max_concurrency: 4
    pricing: { input_per_mtok: 5.00, output_per_mtok: 25.00 }
    params:
      mode: answer
      seed: 33
      flip_noise: 0.05
      refusal_rate: 0.15
      failure_rate: 0.04
      failure_status: 429

judge:
  provider:
    id: mock-judge
    adapter: mock
    model: mock-judge-v1
    max_concurrency: 8
    pricing: { input_per_mtok: 2.00, output_per_mtok: 10.00 }
    # malformed_rate exercises the parse-failure and repair path.
    params: { mode: judge, seed: 99, malformed_rate: 0.05, max_tokens: 600 }
  run_index: 0
  rubric_version: v1
  prompt_path: src/llmbench/prompts/judge.md
  output_schema: rubric_v1
  max_repair_attempts: 1

reliability:
  max_attempts: 5
  retry_on_http: [408, 409, 429, 500, 502, 503, 504]
  retry_on_timeout: true
  backoff: { base_s: 0.01, multiplier: 2.0, max_s: 0.2, jitter: full }

budget:
  max_total_usd: 10.00
  per_phase_usd: { run: 8.00, judge: 2.00 }
  estimate_headroom: 1.15
  abort_on_exceed: true
