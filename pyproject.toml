[project]
name = "llmbench"
version = "0.1.0"
description = "Benchmarking harness for LLM agreement across identity perspectives (AI4PC Lab, Howard University)"
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # pandas 3.x makes pyarrow a hard import-time dependency; 2.x keeps it optional
    "pandas>=2.2,<3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
providers = [
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=0.3",
]
analysis = [
    # Optional: enables tidy.parquet output. CSV is always written regardless.
    "pyarrow>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
llmbench = "llmbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:llmbench.*"]
