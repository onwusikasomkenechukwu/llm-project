[project]
name = "llm-project"
version = "0.2.0"
description = "Agreement benchmarking across identity perspectives and model providers (AI4PC Lab, Howard University)"
requires-python = ">=3.11"
# No pandas: it is used for nothing but reading one spreadsheet, and its
# compiled extensions are blocked by Application Control on the lab laptop.
# openpyxl is pure Python and reads the same files.
dependencies = [
    "openpyxl>=3.1",
    "openai>=1.50",
    "anthropic>=0.40",
    "google-genai>=1.0",
]

[tool.uv]
package = false
